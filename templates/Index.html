<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatSavvy</title>
    <link rel="icon" type="" src="./10061872.png">
    <style>
         body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: rgb(26, 26, 26);
        }
        #chat-container {
            background-color: rgb(80, 80, 80);
            border: 3px solid #00e1ff;
            border-radius: 5px;
            padding: 10px;
            margin: 25px;
            overflow: auto;
        }
        #chat-log {
            width: 100%;
            padding: 12px 20px;
            margin: 8px 0;
            box-sizing: border-box;
            border: none;
            border-bottom: 2px solid #00e1ff;
        }
        .user-message {
            color: #ffffff;
            margin-bottom: 15px;
            font-family: 'Segoe UI', Tahoma, 'Geneva', Verdana, sans-serif;
            font-style: oblique;
        }
        .bot-message {
            color: #ffffff;
            margin-bottom: 15px;
            font-family: 'Segoe UI', Tahoma, 'Geneva', Verdana, sans-serif;
        }
        #user-input {
            width: 90%;
            padding: 10px;
        }
        #submit-btn {
            background-color: #00e5ff;
            color: rgb(0, 0, 0);
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .Heading {
            color: rgb(255, 255, 255);
            text-align: center;
            text-shadow: 2px 2px 3px rgb(5, 57, 87);
            font-family: 'Segoe UI', Tahoma, 'Geneva', Verdana, sans-serif;
            font-style: italic;
            font-size: 35px;
        }
        .center{
            display: block;
            margin-left: auto;
            margin-right: auto;
            width: 135px;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <h2 class="Heading">ChatSavvy</h2>
        <div id="chat-log"></div>
        <input type="text" id="user-input" placeholder="Type your message...Press enter to send" onkeydown="getUserInput(event)" />
        <button id="submit-btn" style="margin-left: 20px; font-size: 15px;" onclick="getUserInput()">Send</button>
    </div>

    <script>
    function addUserMessage(message) {
        document.getElementById('chat-log').innerHTML += `<div class="user-message">You: ${message}</div>`;
    }

    function addBotMessage(message) {
        document.getElementById('chat-log').innerHTML += `<div class="bot-message">Chatbot: ${message}</div>`;
    }

    function getUserInput(event) {
        if (event.key === 'Enter') {
            var userInput = document.getElementById('user-input').value;
            if (userInput.trim() === '') return;

            // Add user message to chat log
            addUserMessage(userInput);

            // Send user input to server and get chatbot response
            fetch('/get_response', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: 'user_input=' + encodeURIComponent(userInput),
            })
            .then(response => response.json())
            .then(data => {
                // Add chatbot response to chat log
                addBotMessage(data.response);

                // Clear user input field
                document.getElementById('user-input').value = '';
            });
        }
    }
</script>
</body>
</html>
